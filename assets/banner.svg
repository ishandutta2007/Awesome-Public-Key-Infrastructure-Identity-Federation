<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .pill-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    
    .pulse-bg { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
    .float-item1 { animation: float1 4s ease-in-out infinite; }
    .float-item2 { animation: float2 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  
  <!-- Dynamic / Animated Background Graphics (Behind text) -->
  <circle cx="200" cy="160" r="180" fill="url(#glow)" class="pulse-bg"/>
  <circle cx="1000" cy="160" r="220" fill="url(#glow)" class="pulse-bg" style="animation-delay: -3s;"/>
  
  <!-- Network / Mesh Connections Background Lines -->
  <path d="M 100 80 Q 300 200 600 60 T 1100 240" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 50 240 Q 400 100 800 260 T 1150 80" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Dynamic Floating Decorative Tech Badges (Positioned to sides so text stays clear) -->
  <g class="float-item1">
    <rect x="70" y="50" width="130" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="135" y="73" text-anchor="middle" class="pill-text">🔑 PKI &amp; X.509</text>
  </g>

  <g class="float-item2">
    <rect x="1000" y="60" width="140" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="1070" y="83" text-anchor="middle" class="pill-text">🛡️ Zero Trust</text>
  </g>

  <g class="float-item2">
    <rect x="90" y="230" width="150" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="165" y="253" text-anchor="middle" class="pill-text">⚡ SPIFFE / SPIRE</text>
  </g>

  <g class="float-item1">
    <rect x="980" y="220" width="150" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="1055" y="243" text-anchor="middle" class="pill-text">🔒 OAuth2 &amp; OIDC</text>
  </g>

  <!-- Central Foreground Content (Title and Subtitle) -->
  <g text-anchor="middle">
    <!-- Lock / Security Shield Icon SVG -->
    <g transform="translate(600, 75) scale(1.3)">
      <path d="M -15 -10 L 0 -18 L 15 -10 L 15 5 C 15 15 0 22 0 22 C 0 22 -15 15 -15 5 Z" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="0" cy="2" r="3" fill="#38bdf8"/>
    </g>
    
    <text x="600" y="155" class="title">Awesome PKI &amp; Identity Federation</text>
    <text x="600" y="195" class="subtitle">Curated Certificate Management, Machine Identity &amp; Self-Hosted PKI Ecosystem</text>
    
    <!-- Tagline Bar -->
    <rect x="350" y="225" width="500" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="600" y="246" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
      🔐 SaaS Platforms • 🚀 Open-Source Projects • 🌐 Machine Identity
    </text>
  </g>
</svg>
