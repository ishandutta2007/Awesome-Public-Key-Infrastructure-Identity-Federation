<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".4"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.7}}@keyframes float1{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes float2{0%{transform:translateY(0)}50%{transform:translateY(10px)}}.pill-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#text-grad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.pill-text{font-size:13px;font-weight:600;fill:#e2e8f0}.pulse-bg{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}.float-item1{animation:float1 4s ease-in-out infinite}.float-item2{animation:float2 5s ease-in-out infinite}</style><rect width="1200" height="320" fill="url(#bg)" rx="16"/><circle cx="200" cy="160" r="180" fill="url(#glow)" class="pulse-bg"/><circle style="animation-delay:-3s" cx="1000" cy="160" r="220" fill="url(#glow)" class="pulse-bg"/><path fill="none" stroke="#334155" stroke-dasharray="6 6" stroke-width="1.5" d="M 100 80 Q 300 200 600 60 T 1100 240"/><path fill="none" stroke="#1e293b" stroke-width="2" d="M 50 240 Q 400 100 800 260 T 1150 80"/><g class="float-item1"><rect width="130" height="36" x="70" y="50" fill="#1e293b" stroke="#3b82f6" stroke-width="1" rx="18"/><text x="135" y="73" class="pill-text" text-anchor="middle">🔑 PKI &amp; X.509</text></g><g class="float-item2"><rect width="140" height="36" x="1000" y="60" fill="#1e293b" stroke="#a855f7" stroke-width="1" rx="18"/><text x="1070" y="83" class="pill-text" text-anchor="middle">🛡️ Zero Trust</text></g><g class="float-item2"><rect width="150" height="36" x="90" y="230" fill="#1e293b" stroke="#10b981" stroke-width="1" rx="18"/><text x="165" y="253" class="pill-text" text-anchor="middle">⚡ SPIFFE / SPIRE</text></g><g class="float-item1"><rect width="150" height="36" x="980" y="220" fill="#1e293b" stroke="#f59e0b" stroke-width="1" rx="18"/><text x="1055" y="243" class="pill-text" text-anchor="middle">🔒 OAuth2 &amp; OIDC</text></g><g text-anchor="middle"><g transform="translate(600, 75) scale(1.3)"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M -15 -10 L 0 -18 L 15 -10 L 15 5 C 15 15 0 22 0 22 C 0 22 -15 15 -15 5 Z"/><circle cx="0" cy="2" r="3" fill="#38bdf8"/></g><text x="600" y="155" class="title">Awesome PKI &amp; Identity Federation</text><text x="600" y="195" class="subtitle">Curated Certificate Management, Machine Identity &amp; Self-Hosted PKI Ecosystem</text><rect width="500" height="32" x="350" y="225" fill="#0f172a" stroke="#334155" stroke-width="1" rx="16"/><text x="600" y="246" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔐 SaaS Platforms • 🚀 Open-Source Projects • 🌐 Machine Identity</text></g></svg>